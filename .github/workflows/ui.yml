name: React UI CI

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # package-lock.json is not committed yet, so use `npm install`
        # (not `npm ci`). This also auto-creates the lock for caching.
        run: npm install --no-audit --no-fund

      - name: Lint (soft)
        continue-on-error: true
        run: npm run lint --if-present

      - name: Type-check / build (soft)
        # The project is a learning scaffold; some referenced modules may
        # not exist yet. We surface the output but don't fail CI on it.
        continue-on-error: true
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit || true
          else
            echo "::notice::No tsconfig.json yet — skipping type-check."
          fi
          npm run build --if-present || true

      - name: Unit tests (soft)
        continue-on-error: true
        run: npm test --if-present -- --run || true

      - name: npm audit (soft)
        continue-on-error: true
        run: npm audit --audit-level=high || true
