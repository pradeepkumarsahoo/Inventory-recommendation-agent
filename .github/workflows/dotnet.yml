name: .NET API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Retail.sln

      - name: Build (Release, warnings not errors in CI)
        # Directory.Build.props sets TreatWarningsAsErrors=true for local dev;
        # CI relaxes it so analyzer warnings on new SDK versions don't block.
        run: dotnet build Retail.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=false

      - name: Test
        continue-on-error: true
        run: dotnet test Retail.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" -p:TreatWarningsAsErrors=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: api/**/TestResults/*.trx
          if-no-files-found: ignore
