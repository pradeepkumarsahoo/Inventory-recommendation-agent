name: End-to-end stack

# This workflow runs the full docker-compose stack. It depends on files
# (sample CSV data, UI build artifacts) that may not all be present in the
# learning repo yet, so it is MANUAL-DISPATCH ONLY to avoid noisy failures
# on every push. Trigger it from the Actions tab once the stack is complete.

on:
  workflow_dispatch:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: pre
        run: |
          missing=0
          if [ ! -d databricks/sample-data ]; then
            echo "::warning::databricks/sample-data not present"
            missing=1
          fi
          if [ ! -f ui/package-lock.json ]; then
            echo "::warning::ui/package-lock.json not present"
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: docker compose build
        if: steps.pre.outputs.missing == '0'
        run: docker compose -f docker-compose.yml build

      - name: docker compose up
        if: steps.pre.outputs.missing == '0'
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for API
        if: steps.pre.outputs.missing == '0'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5080/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "API never came up"
          docker compose logs api || true
          exit 1

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
