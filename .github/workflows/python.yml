name: Python agents CI

on:
  push:
    branches: [main]
    paths:
      - "ai-agents/**"
      - "ai-guardrails/**"
      - "reports/**"
      - "tests/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "ai-agents/**"
      - "ai-guardrails/**"
      - "reports/**"
      - "tests/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ai-agents/requirements.txt
            ai-guardrails/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest
          # LangChain is optional at test time; install if available
          pip install langchain langchain-core || true
          # Install any extra project requirements that exist
          if [ -f ai-agents/requirements.txt ]; then
            pip install -r ai-agents/requirements.txt || true
          fi
          if [ -f ai-guardrails/requirements.txt ]; then
            pip install -r ai-guardrails/requirements.txt || true
          fi

      - name: Lint (ruff) — soft
        continue-on-error: true
        run: |
          pip install ruff
          ruff check ai-agents || true

      - name: Run data-free unit tests (new modules)
        env:
          PYTHONPATH: ai-agents
        run: |
          python -m pytest \
            ai-agents/tests/test_optimization.py \
            ai-agents/tests/test_evaluation.py \
            ai-agents/tests/test_governance.py \
            ai-agents/tests/test_security.py \
            ai-agents/tests/test_simulation_explainability.py \
            -q

      - name: Run data-dependent tests if sample data present
        env:
          PYTHONPATH: ai-agents
        run: |
          if [ -d databricks/sample-data ] && [ -f databricks/sample-data/products.csv ]; then
            python -m pytest ai-agents/tests/test_agents.py -q || true
            python -m pytest ai-guardrails/tests -q || true
            python -m pytest tests/integration -q || true
          else
            echo "::notice::Skipping data-dependent tests — databricks/sample-data not present."
          fi

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (soft)
        continue-on-error: true
        run: |
          pip install pip-audit
          if [ -f ai-agents/requirements.txt ]; then
            pip-audit -r ai-agents/requirements.txt || true
          fi

      - name: Bandit static scan (soft)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r ai-agents/retail_agents -q || true
